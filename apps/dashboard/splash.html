<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: transparent !important;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .splash-card {
      position: absolute;
      top: 1px; left: 1px; right: 1px; bottom: 1px;
      background-color: #ffffff;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #111827;
      -webkit-app-region: drag;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.05);
    }

    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .logo {
      width: 80px;
      height: 80px;
      background: url('./public/logo.png') center/contain no-repeat;
      border-radius: 50%;
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .app-name {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      opacity: 0;
      transform: translateY(10px);
      animation: fade-up 0.8s ease-out 0.2s forwards;
    }

    .loading-container {
      position: absolute;
      bottom: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .status-text {
      font-size: 14px;
      opacity: 0.6;
      font-weight: 500;
      letter-spacing: 0.5px;
      transition: opacity 0.4s ease;
    }

    /* Circular Spinner */
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(17, 24, 39, 0.1);
      border-top-color: #111827;
      border-radius: 50%;
      animation: spinner-spin 0.8s linear infinite;
    }

    @keyframes spinner-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fade-up {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Transition states */
    body.ready .loading-container {
      opacity: 0;
      transform: translateY(10px);
    }

    body.ready .logo-container {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="logo-container" id="logo-container">
      <div class="logo" id="logo"></div>
      <div class="app-name">SaaS App</div>
    </div>
    
    <div class="loading-container" id="loading-container">
      <div class="spinner"></div>
      <div class="status-text" id="status-text">Initializing workspace...</div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    
    ipcRenderer.on('stop-loading', () => {
      document.body.classList.add('ready');
      const statusText = document.getElementById('status-text');
      
      // Tell main process we are done animating after 800ms
      setTimeout(() => {
        ipcRenderer.send('splash-animation-done');
      }, 800);
    });
  </script>
</body>
</html>
